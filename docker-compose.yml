# Local services for development and the integration tests.
#
#   docker compose up -d
#   export DATABASE_URL=postgres://factory:factory@localhost:5432/app?sslmode=disable
#   export REDIS_URL=redis://localhost:6379/0
#   go test ./...
#
# Inside the Software Factory the same services run as test services, reachable
# by the hostnames postgres and redis.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
